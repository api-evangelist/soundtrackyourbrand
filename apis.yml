name: Soundtrack Your Brand
description: >-
  Soundtrack Your Brand (now branded simply "Soundtrack", soundtrack.io) is a
  business music streaming service that provides licensed background music for
  physical spaces such as retail stores, restaurants, cafes, hotels and gyms.
  Originally spun out of Spotify, the company curates and schedules music across
  a customer's locations and sound zones, and exposes a public GraphQL API
  (api.soundtrackyourbrand.com/v2) that lets developers build display, control
  and monitoring apps on top of Soundtrack — reading now-playing state,
  controlling playback (play/pause/skip/volume) on sound zones, managing
  playlists, schedules and music libraries, and subscribing to real-time
  updates. The API is free for paying Soundtrack customers and authenticates
  with an API token. Surfaced originally as a portfolio company of
  Balderton Capital.
