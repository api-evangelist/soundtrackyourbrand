apis:
- name: Soundtrack API
  description: >-
    Soundtrack's public GraphQL API for building display, control and monitoring
    apps on top of the Soundtrack business music service. Query now-playing and
    schedule state, control playback on sound zones (play, pause, skip, volume,
    queue), manage playlists, schedules and music libraries, and subscribe to
    real-time updates for accounts, locations, sound zones, devices and
    now-playing. GraphQL over a single POST endpoint; introspection is enabled.
